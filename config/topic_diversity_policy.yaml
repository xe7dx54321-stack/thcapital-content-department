schema_version: v1

history_window_days: 7
duplicate_similarity_threshold: 0.72
hard_duplicate_threshold: 0.88

penalties:
  recent_topic_duplicate: 0.18
  same_source_repetition: 0.10
  same_lane_repetition: 0.08
  high_competitive_same_angle: 0.14
  metadata_title: 0.20
  weak_differentiation: 0.12

boosts:
  strong_differentiated_angle: 0.12
  multi_source_support: 0.08
  fresh_undercovered_angle: 0.10

guards:
  reject_raw_metadata_title: true
  require_angle_for_repeated_event: true
  require_human_readable_title: true

cloud_mode:
  require_live_rss: false
  require_mac_runtime_validation: false

similarity_weights:
  title_similarity: 0.35
  normalized_title_similarity: 0.25
  entity_overlap: 0.20
  company_overlap: 0.10
  event_type_match: 0.10
